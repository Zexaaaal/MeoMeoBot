name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk and Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - name: Test
        run: |
          cargo test -p meomeobot
          cargo test -p frontend

      - name: Increment version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $current = [regex]::Match($manifest, '(?m)^version = "(\d+)\.(\d+)\.(\d+)"')
          $patch = [int]$current.Groups[3].Value

          if ($patch -eq 0) {
            Write-Host "Patch is 0, skipping auto-increment."
          } else {
            $newVersion = "$($current.Groups[1].Value).$($current.Groups[2].Value).$($patch + 1)"
            $manifest = $manifest.Remove($current.Index, $current.Length).Insert($current.Index, "version = `"$newVersion`"")
            Set-Content Cargo.toml $manifest -NoNewline -Encoding UTF8
            cargo update --workspace
            Write-Host "Version updated to $newVersion"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "bump to: $newVersion [skip ci]"
            git push
          }

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          New-Item -ItemType Directory -Force app/bin | Out-Null
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName app/bin/ffmpeg.exe

      - name: Clear previous release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $assets = gh release view release --json assets --jq '.assets[].name' 2>$null
          foreach ($asset in $assets) {
            gh release delete-asset release $asset --yes
          }

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          tauriScript: cargo tauri
          tagName: release
          releaseName: Latest
          releaseBody: meow meow meow meow
          releaseDraft: false
          prerelease: false

      - name: Move release tag
        run: |
          git tag -f release
          git push origin release --force
