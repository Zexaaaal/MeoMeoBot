[package]
name = "frontend"
version.workspace = true
edition.workspace = true

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "HtmlIFrameElement", "HtmlCanvasElement", "HtmlImageElement", "CanvasRenderingContext2d", "CanvasGradient", "TextMetrics", "Document", "Element", "HtmlElement", "DomRect"] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "wasmbind", "std"] }
console_error_panic_hook = "0.1"
shared.workspace = true
